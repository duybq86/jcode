name: Build and publish Docker image

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-latest
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Get latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(gh release view --repo cnjack/jcode --json tagName --jq .tagName)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub latest tag version
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          response="$(curl -fsS "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/jcode/tags/latest")"
          latest_version="$(jq -r '.images[0].labels["org.opencontainers.image.version"] // empty' <<< "$response")"
          if [[ "$latest_version" == "$VERSION" ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: check-release
    if: needs.check-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream release tag
        uses: actions/checkout@v7
        with:
          repository: cnjack/jcode
          ref: ${{ needs.check-release.outputs.version }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push versioned and latest tags
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.check-release.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jcode:${{ needs.check-release.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/jcode:latest
          labels: |
            org.opencontainers.image.source=https://github.com/cnjack/jcode
            org.opencontainers.image.version=${{ needs.check-release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
